# Server Configuration
server.port=8080
server.address=localhost

# Application Configuration
serverId=server1
superPass=superpass123
token.secret=secret123

# ZooKeeper Configuration
zkConnectString=localhost:2181
zkNamespace=
zookeeper.session.timeout=5000
zookeeper.connection.timeout=5000

# gRPC Configuration
grpc.port=9090

# Database Configuration
spring.application.name=hellohello
spring.datasource.url=jdbc:h2:file:/tmp/hellohello-server1
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=password
spring.jpa.hibernate.ddl-auto=update

# Logging
logging.level.edu.sjsu.cmpe172.hellohello=INFO
logging.level.org.apache.zookeeper=WARN